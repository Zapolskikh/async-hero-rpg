name: Web / GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz 'templates/web_*' -d /tmp/export-templates
          cp /tmp/export-templates/templates/web_* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import and check game
        run: |
          godot --headless --editor --path . --quit
          godot --headless --script res://tests/run_tests.gd
          godot --headless --script res://tests/rules_tests.gd
          godot --headless --script res://tests/combat_revision_tests.gd
          godot --headless --script res://tests/training_tests.gd -- --qa
          python3 -m unittest discover -s tests -p 'test_web_build.py'

      - name: Export versioned Web build
        run: |
          mkdir -p build/web
          entry="game-${GITHUB_SHA:0:12}.html"
          godot --headless --export-release Web "build/web/$entry"
          python3 tools/prepare_web_build.py build/web --entry "$entry" --commit "$GITHUB_SHA"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
